name: Compilar instalador Zompix Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Compilar Zompix
        shell: pwsh
        run: ./construir.ps1
      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Crear instalador
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" zompix.iss
          if ($LASTEXITCODE -ne 0) {throw "No se pudo crear el instalador"}
      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: Zompix-Setup-Windows
          path: dist/Zompix-Setup.exe
          if-no-files-found: error
      - name: Publicar v1.4.1
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.4.1 *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create v1.4.1 "./dist/Zompix-Setup.exe" --title "ZOMPIX v1.4.1" --notes "Biblioteca de 10 imágenes de prueba offline, tres resoluciones y ajustes recomendados." --target "${{ github.sha }}"
            if ($LASTEXITCODE -ne 0) {throw "No se pudo publicar v1.4.1"}
          }
          gh release edit v1.4.1 --latest
          if ($LASTEXITCODE -ne 0) {throw "No se pudo definir v1 como última versión"}
