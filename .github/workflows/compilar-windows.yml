name: Compilar EXE Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Crear EXE e incluir IA
        shell: pwsh
        run: ./construir.ps1
      - name: Publicar EXE
        uses: actions/upload-artifact@v4
        with:
          name: MejoraIA-Windows-x64
          path: dist/MejoraIA.exe
          if-no-files-found: error
