name: Compilar EXE Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Crear EXE e incluir IA
        shell: pwsh
        run: ./construir.ps1
      - name: Publicar EXE como artifact
        uses: actions/upload-artifact@v4
        with:
          name: MejoraIA-Windows-x64
          path: dist/MejoraIA.exe
          if-no-files-found: error
      - name: Publicar versión inicial v5.1.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v5.1.0 *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create v5.1.0 "./dist/MejoraIA.exe" --title "MEJORA IA v5.1.0" --notes "Portapapeles, dimensiones px/cm, DPI configurable y estimación de tiempo." --target "${{ github.sha }}"
            if ($LASTEXITCODE -ne 0) { throw "No se pudo publicar v5.1.0" }
          }
